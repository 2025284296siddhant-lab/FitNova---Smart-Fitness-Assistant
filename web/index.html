<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FitNova — Smart Fitness Assistant</title>
  <meta name="description" content="FitNova — personal fitness intelligence: personalised workout plans, completion tracking, progress and vitals.">
  <meta name="theme-color" content="#090B0E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitNova">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" aria-label="Primary">
      <a class="brand" href="#/" aria-label="FitNova home">
        <span class="brand-mark" data-icon="logo"></span>
        <span><span class="brand-name">Fit<b>Nova</b></span><br><span class="brand-tag">Personal Fitness Intelligence</span></span>
      </a>
      <nav class="nav" id="side-nav"></nav>
      <div class="sidebar-foot" id="side-profile"></div>
    </aside>

    <header class="appbar">
      <a class="brand" href="#/" aria-label="FitNova home">
        <span class="brand-mark" data-icon="logo"></span>
        <span><span class="brand-name">Fit<b>Nova</b></span><br><span class="brand-tag">Personal Fitness Intelligence</span></span>
      </a>
      <a class="avatar-btn" id="appbar-avatar" href="#/profile" aria-label="Your profile">·</a>
    </header>

    <div class="main">
      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <nav class="tabbar" id="tab-nav" aria-label="Primary"></nav>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <!-- Shown only if the app fails to boot (e.g. a very old Android System WebView). app.js removes it on start. -->
  <div id="legacy-notice" style="position:fixed;left:0;top:0;right:0;bottom:0;z-index:999;background:#090B0E;color:#F3F5F7;font-family:sans-serif;text-align:center;padding:40px 24px;opacity:0;-webkit-animation:fnShow .3s 4s forwards;animation:fnShow .3s 4s forwards">
    <div style="font-size:28px;font-weight:700;margin-top:20vh">Fit<span style="color:#2EE6FF">Nova</span></div>
    <p style="color:#A4ACB8;font-size:15px;line-height:1.6;max-width:420px;margin:20px auto">FitNova couldn't start because this device's web engine is out of date.
      Please update <b>Android System WebView</b> (or Google Chrome) from the Play Store, then reopen the app.</p>
  </div>
  <style>@-webkit-keyframes fnShow{to{opacity:1}}@keyframes fnShow{to{opacity:1}}</style>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
